services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://tracker:tracker@db:5432/tracker
      JWT_SECRET: change-me-to-a-long-random-string
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
